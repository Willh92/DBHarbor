# ==============================================================================
# DBHarbor — Apache httpd Reverse Proxy (mod_proxy + mod_proxy_http + mod_headers)
# ==============================================================================

<VirtualHost *:443>
    ServerName db.example.com

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/db.example.com.pem
    SSLCertificateKeyFile /etc/ssl/private/db.example.com.key

    ProxyPreserveHost On
    ProxyTimeout 600
    LimitRequestBody 536870912

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    # Option A: Unix Domain Socket (Apache >= 2.4.7)
    ProxyPass        / "unix:/run/dbharbor/dbharbor.sock|http://localhost/" nocanon
    ProxyPassReverse / "unix:/run/dbharbor/dbharbor.sock|http://localhost/"

    # Option B: Local TCP (uncomment if using -host 127.0.0.1 -port 8787)
    # ProxyPass        / "http://127.0.0.1:8787/" nocanon
    # ProxyPassReverse / "http://127.0.0.1:8787/"
</VirtualHost>
