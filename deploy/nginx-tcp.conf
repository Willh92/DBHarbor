# ==============================================================================
# DBHarbor — Nginx Reverse Proxy via Local TCP (127.0.0.1:8787)
# ==============================================================================
# Start DBHarbor bound exclusively to loopback and trust the local proxy IP
# (so login rate-limiting and audit logs see real client IPs via X-Real-IP):
#   sudo ./install-service.sh install --host 127.0.0.1 --port 8787
#   And set `"trustedProxies": ["127.0.0.1/32", "::1/128"]` in <DataDir>/config.json
#   (or env `DBHARBOR_TRUSTED_PROXIES=127.0.0.1/32,::1/128`).
# ==============================================================================

upstream dbharbor_tcp {
    server 127.0.0.1:8787;
    keepalive 32;
}

server {
    listen 80;
    server_name db.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name db.example.com;

    ssl_certificate     /etc/ssl/certs/db.example.com.pem;
    ssl_certificate_key /etc/ssl/private/db.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 512m;

    location / {
        proxy_pass http://dbharbor_tcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
