# ==============================================================================
# DBHarbor — Nginx Reverse Proxy via Unix Domain Socket (Recommended Same-Host)
# ==============================================================================
# 1. Start DBHarbor on Unix Domain Socket:
#    sudo ./install-service.sh install --unix-socket /run/dbharbor/dbharbor.sock --unix-socket-perm 0660
# 2. Grant Nginx worker user (www-data or nginx) group access to the socket:
#    sudo usermod -aG dbharbor www-data && sudo systemctl restart nginx
# ==============================================================================

upstream dbharbor_uds {
    server unix:/run/dbharbor/dbharbor.sock;
    keepalive 32;
}

server {
    listen 80;
    server_name db.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name db.example.com;

    ssl_certificate     /etc/ssl/certs/db.example.com.pem;
    ssl_certificate_key /etc/ssl/private/db.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Allow large SQL / CSV / JSON batch file imports
    client_max_body_size 512m;

    location / {
        proxy_pass http://dbharbor_uds;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Forward real client IP & scheme for anti-bruteforce rate-limiting & audit logs
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming full-DB SQL Dump export & long-running OLAP query support
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
