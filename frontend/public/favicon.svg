<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071A3E" />
      <stop offset="48%" stop-color="#1677FF" />
      <stop offset="100%" stop-color="#13C2C2" />
    </linearGradient>

    <radialGradient id="topGlow" cx="384" cy="88" r="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#69E2FF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1677FF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="rimGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.40" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.18" />
    </linearGradient>

    <linearGradient id="cylSideGrad" x1="140" y1="0" x2="372" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#91D5FF" />
      <stop offset="32%" stop-color="#E6F7FF" />
      <stop offset="68%" stop-color="#BAE7FF" />
      <stop offset="100%" stop-color="#5CDBD3" />
    </linearGradient>

    <linearGradient id="anchorGlobalGrad" x1="256" y1="236" x2="256" y2="442" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F0FBFF" />
      <stop offset="100%" stop-color="#B5F5EC" />
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="0" y="0" width="512" height="512" rx="116" />
    </clipPath>

    <clipPath id="tier2Clip">
      <path d="M 140 162 A 116 27 0 0 0 372 162 L 372 200 A 116 27 0 0 1 140 200 Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- Squircle Base & Ambient Glow -->
    <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bgGrad)" />
    <rect x="0" y="0" width="512" height="512" fill="url(#topGlow)" />

    <!-- Subtle Nautical Harbor Waves -->
    <path d="M 0 384 C 132 348, 226 420, 358 384 C 434 363, 478 372, 512 388 L 512 512 L 0 512 Z" fill="#FFFFFF" fill-opacity="0.06" />
    <path d="M 0 430 C 150 400, 290 460, 422 424 C 464 413, 492 416, 512 426 L 512 512 L 0 512 Z" fill="#041026" fill-opacity="0.16" />

    <!-- Database Tier 1 (Top 3D Cylinder) -->
    <path d="M 140 106 L 140 144 A 116 27 0 0 0 372 144 L 372 106 Z" fill="url(#cylSideGrad)" />
    <ellipse cx="256" cy="106" rx="116" ry="27" fill="#FFFFFF" />
    <ellipse cx="256" cy="106" rx="92" ry="18" fill="none" stroke="#E6F4FF" stroke-width="2.5" />
    <circle cx="326" cy="138" r="6.5" fill="#0958D9" />
    <circle cx="302" cy="142" r="6.5" fill="#08979C" />

    <!-- Database Tier 2 (Middle 3D Cylinder) -->
    <g clip-path="url(#tier2Clip)">
      <path d="M 140 162 A 116 27 0 0 0 372 162 L 372 200 A 116 27 0 0 1 140 200 Z" fill="url(#cylSideGrad)" />
      <path d="M 140 162 A 116 27 0 0 0 372 162" fill="none" stroke="#FFFFFF" stroke-width="6" />
    </g>
    <circle cx="326" cy="194" r="6.5" fill="#0958D9" />
    <circle cx="302" cy="198" r="6.5" fill="#08979C" />

    <!-- Unified Harbor Anchor -->
    <circle cx="256" cy="258" r="17" fill="none" stroke="url(#anchorGlobalGrad)" stroke-width="13" />
    <rect x="240" y="273" width="32" height="144" rx="4" fill="url(#anchorGlobalGrad)" />
    <path d="M 118 312 C 130 382, 188 414, 256 414 C 324 414, 382 382, 394 312" fill="none" stroke="url(#anchorGlobalGrad)" stroke-width="32" stroke-linecap="round" />
    <path d="M 226 410 L 256 438 L 286 410 Z" fill="url(#anchorGlobalGrad)" stroke="url(#anchorGlobalGrad)" stroke-width="8" stroke-linejoin="round" />
    <path d="M 110 266 L 82 324 L 118 308 L 156 316 Z" fill="url(#anchorGlobalGrad)" stroke="url(#anchorGlobalGrad)" stroke-width="10" stroke-linejoin="round" />
    <path d="M 402 266 L 356 316 L 394 308 L 430 324 Z" fill="url(#anchorGlobalGrad)" stroke="url(#anchorGlobalGrad)" stroke-width="10" stroke-linejoin="round" />

    <!-- Outer Specular Rim -->
    <rect x="5" y="5" width="502" height="502" rx="111" fill="none" stroke="url(#rimGrad)" stroke-width="4" />
  </g>
</svg>
