name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"
  GOPROXY: "https://proxy.golang.org,direct"

jobs:
  verify:
    name: Build & Test (Server + Desktop GUI)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum

      - name: Validate POSIX service installer script
        run: |
          bash -n scripts/install-service.sh
          if LC_ALL=C grep -q $'\r' scripts/install-service.sh; then
            echo "Error: scripts/install-service.sh contains CRLF line endings" >&2
            exit 1
          fi

      - name: Install frontend dependencies & verify TypeScript + Vite build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Cross-compile host & sample targets (Server + Desktop GUI)
        run: |
          node scripts/build.mjs --skip-fe
          GOOS=windows GOARCH=amd64 go -C backend build -trimpath -ldflags="-s -w -H=windowsgui" -o /tmp/dbharbor-desktop-win.exe ./cmd/dbharbor-desktop
          GOOS=darwin GOARCH=arm64 go -C backend build -trimpath -ldflags="-s -w" -o /tmp/dbharbor-desktop-mac ./cmd/dbharbor-desktop
          rm -f /tmp/dbharbor-desktop-win.exe /tmp/dbharbor-desktop-mac

      - name: Run Go unit, security, Unix socket & desktop E2E tests
        run: |
          go -C backend test -v ./...

      - name: Smoke test compiled binary CLI version output
        run: |
          chmod +x dist/dbharbor-linux-amd64 dist/dbharbor-desktop-linux-amd64
          ./dist/dbharbor-linux-amd64 -version
          ./dist/dbharbor-desktop-linux-amd64 -version
